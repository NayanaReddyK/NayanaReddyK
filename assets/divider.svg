<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-labelledby="nrd-title">
  <title id="nrd-title">Section divider</title>
  <defs>
    <style>@media (prefers-reduced-motion: reduce){ .nrd-motion{display:none} }</style>
    <linearGradient id="nrd-line" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="nrd-glow" x="-500%" y="-500%" width="1100%" height="1100%">
      <feGaussianBlur stdDeviation="2.5" result="nrd-blur"/>
      <feMerge><feMergeNode in="nrd-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="100" y1="14" x2="1100" y2="14" stroke="url(#nrd-line)" stroke-width="1.5"/>
  <circle cx="556" cy="14" r="2" fill="#C77B9B" fill-opacity="0.8"/>
  <circle cx="644" cy="14" r="2" fill="#C77B9B" fill-opacity="0.8"/>
  <rect x="595" y="9" width="10" height="10" transform="rotate(45 600 14)" fill="#E5B5C7" filter="url(#nrd-glow)"/>

  <g class="nrd-motion">
    <circle cy="14" r="3" fill="#F8F0F3" filter="url(#nrd-glow)">
      <animate attributeName="cx" from="100" to="1100" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
