<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-labelledby="nrf-title">
  <title id="nrf-title">Thanks for stopping by. Nayana Reddy, AI/ML and software development.</title>
  <defs>
    <style>
      .nrf-note{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:24px;fill:#E5B5C7}
      .nrf-sub{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#C77B9B;letter-spacing:4px}
      @media (prefers-reduced-motion: reduce){ .nrf-motion{display:none} }
    </style>
    <clipPath id="nrf-clip"><rect width="1200" height="140" rx="16"/></clipPath>
    <linearGradient id="nrf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#190B12"/>
      <stop offset="0.5" stop-color="#10070C"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="nrf-wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset="0.5" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <filter id="nrf-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="140">
      <feGaussianBlur stdDeviation="3" result="nrf-blur"/>
      <feMerge><feMergeNode in="nrf-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#nrf-clip)">
    <rect width="1200" height="140" fill="url(#nrf-bg)"/>
    <path d="M0 88C150 64 300 112 450 88S750 64 900 88S1100 110 1200 84" fill="none" stroke="url(#nrf-wave)" stroke-width="2"/>
    <path d="M0 98C150 74 300 122 450 98S750 74 900 98S1100 120 1200 94" fill="none" stroke="#C77B9B" stroke-opacity="0.25" stroke-width="1"/>
    <text class="nrf-note" x="600" y="46" text-anchor="middle">Thanks for stopping by.</text>
    <text class="nrf-sub" x="600" y="126" text-anchor="middle">NAYANA REDDY · AI/ML · SOFTWARE</text>

    <g class="nrf-motion">
      <path d="M0 88C150 64 300 112 450 88S750 64 900 88S1100 110 1200 84" pathLength="1000" fill="none" stroke="#E5B5C7" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="70 930" filter="url(#nrf-glow)">
        <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
